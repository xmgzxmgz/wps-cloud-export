<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>WPS 云文档下载</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

    <!-- ══════════ 登录 ══════════ -->
    <section id="login-section" class="login-section">
        <div class="login-card">
            <span class="logo-mark">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="17" x2="12" y2="11"/>
                    <polyline points="9 14 12 17 15 14"/>
                </svg>
            </span>

            <div class="login-head">
                <h1>WPS 云文档下载</h1>
                <p>批量导出金山文档与设备文档到本地</p>
            </div>

            <div class="login-chips">
                <span class="chip">云文档</span>
                <span class="chip">设备文档</span>
                <span class="chip">增量同步</span>
            </div>

            <div class="login-form">
                <div class="field">
                    <label for="wps-sid">wps_sid <span class="req">*</span></label>
                    <input type="text" id="wps-sid" placeholder="粘贴浏览器 Cookie 中的 wps_sid" autocomplete="off" spellcheck="false">
                </div>
                <div class="field">
                    <label for="csrf">csrf <span class="opt">可选，遇到 403 时填写</span></label>
                    <input type="text" id="csrf" placeholder="cookie 中的 csrf 值" autocomplete="off" spellcheck="false">
                </div>

                <button id="btn-login" class="btn btn-primary btn-block" onclick="doLogin()">登录并读取账号</button>
                <button type="button" class="link-btn" onclick="toggleHelp()">如何获取 Cookie？</button>

                <div id="help-content" class="help-content hidden">
                    <ol>
                        <li>Chrome 打开 <a href="https://www.kdocs.cn" target="_blank" rel="noopener">kdocs.cn</a> 并登录</li>
                        <li>按 <kbd>F12</kbd> → <strong>Application</strong> → <strong>Cookies</strong> → <code>kdocs.cn</code></li>
                        <li>复制 <code>wps_sid</code> 的值粘贴到上方</li>
                    </ol>
                </div>
            </div>

            <p class="login-foot">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Cookie 仅在本机与服务端之间使用，不上传任何第三方
            </p>
        </div>
    </section>

    <!-- ══════════ 主界面 ══════════ -->
    <section id="main-section" class="app-shell hidden">

        <header class="topbar">
            <div class="brand-group">
                <span class="logo-mark sm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                </span>
                <div class="brand-text">
                    <strong>WPS 云文档下载</strong>
                    <span>批量导出 · 本地保存</span>
                </div>
            </div>

            <div class="user-group">
                <img id="user-avatar" class="avatar" src="" alt="">
                <div class="user-meta">
                    <span id="user-name" class="user-name">未登录</span>
                    <span class="user-sub">
                        <span id="user-vip" class="vip-badge hidden">VIP</span>
                        <span id="storage-info" class="storage"></span>
                    </span>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="cloud" onclick="switchTab('cloud')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                </svg>
                云文档
            </button>
            <button class="tab" data-tab="device" onclick="switchTab('device')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
                设备文档
            </button>
        </nav>

        <!-- 云文档 -->
        <div id="panel-cloud" class="panel">
            <div class="toolbar">
                <select id="group-select" class="select" onchange="loadGroupFiles()">
                    <option value="">选择文档组…</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="expandAll()">展开</button>
                <button class="btn btn-ghost btn-sm" onclick="collapseAll()">折叠</button>
                <span class="toolbar-sep"></span>
                <button class="btn btn-ghost btn-sm" onclick="selectAll()">全选</button>
                <button class="btn btn-ghost btn-sm" onclick="deselectAll()">取消</button>

                <div class="toolbar-right">
                    <span id="selected-count" class="sel-info is-empty">已选 0 个</span>
                    <button class="btn btn-primary btn-sm" onclick="downloadSelected()" id="btn-download" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        下载选中
                    </button>
                    <button class="btn btn-success btn-sm" onclick="downloadAll()" id="btn-download-all">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        一键下载全部
                    </button>
                </div>
            </div>

            <div id="file-tree" class="file-tree">
                <div class="empty">
                    <span class="empty-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <p>选择上方文档组开始浏览</p>
                </div>
            </div>
        </div>

        <!-- 设备文档 -->
        <div id="panel-device" class="panel hidden">
            <div class="toolbar">
                <select id="device-select" class="select" onchange="loadDeviceFiles()">
                    <option value="">全部设备</option>
                </select>
                <button class="btn btn-ghost btn-sm" onclick="selectAllDevice()">全选</button>
                <button class="btn btn-ghost btn-sm" onclick="deselectAllDevice()">取消</button>

                <div class="toolbar-right">
                    <span id="device-selected-count" class="sel-info is-empty">已选 0 个</span>
                    <button class="btn btn-primary btn-sm" onclick="downloadDeviceSelected()" id="btn-download-device" disabled>
                        下载选中
                    </button>
                </div>
            </div>

            <div id="device-files" class="file-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </section>

    <!-- ══════════ 下载进度 ══════════ -->
    <div id="download-modal" class="modal hidden">
        <div class="modal-box">
            <div class="modal-head">
                <span class="modal-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </span>
                <div class="flex-1">
                    <h2 id="modal-title">下载进度</h2>
                    <p id="progress-subtitle">准备中…</p>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-text" class="progress-count"></p>

            <div id="progress-log" class="progress-log"></div>

            <div id="verify-report" class="verify-report hidden">
                <h4>核对报告</h4>
                <div id="verify-content" class="verify-content"></div>
            </div>

            <div class="modal-foot">
                <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
